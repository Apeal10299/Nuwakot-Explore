<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
    <div class="log_in">
        <form action="" method="post">
            <div class="pp" fixed>
                <!-- Image Preview -->
                <div class="image-preview" id="image-preview">
                    <img id="preview" src="#" alt="Image Preview" style="display: none;" />
                </div>
                <div  class="Img_btn">
                    <input id="file-upload" type="file" accept="image/*" />
                    <label for="file-upload" id="file-upload-label">Select Image</label>
                </div>
            </div>
            
        <div class="info_part">
            <div class="name">
                <label for="name">Name:</label>
                <input type="text" id="name" name="fname" placeholder="First Name" required>
                <input type="text" id="name" name="mname" placeholder="Middle Name" >
                <input type="text" id="name" name="lname" placeholder="Last Name" required>
            </div>

            <div class="address">
                <label for="address">Address:</label>
                <input type="text"  for="address" id="district" name="district" placeholder="District" required>
                <input type="text" for="address"  id="address" name="address" placeholder="" required>
                <input type="number" for="address" id="wardno" name="wardno" placeholder="Ward No" required>
            </div>

            <div class="contact">
                <label for="contact">Contact:</label>
                <input type="number"  id="contact" name="Mobile" placeholder="Mobile Number" required >
                <input type="number"  id="contact" name="Telephone" placeholder="Telephone Number" >
                <input type="mail" id="contact" name="G_mail" value="xyz@gmail.com"  required>

            </div>

            <div class="religion">
                <label for="religion"> Religion: </label>
                <input type="text" id="religion"  name="Caste" placeholder="Caste" required >
                <input type="text" id="religion"  name="Nationality" placeholder="Nationality" required >
                <input type="text" id="religion"  name="Religion" placeholder="Religion" required >
                


            </div>
            <div class="school">
                <label for="level">Choose your education level:</label>
             <select id="level" onchange="updateSchoolFields()">
                <option value="" >Select Level</option>
                <option value="10">Grade 10</option>
                <option value="12">Grade 12</option>
                <option value="bachelor">Bachelor's Degree</option>
                <option value="master">Master's Degree</option>
                </select>
                <label for="Age">Age: </label>
                <input type="number" id="Age"  name="Age" placeholder="Age" required >
                <div id="school-container">
                <!-- School input fields will be dynamically added here -->
                </div>
            </div>

            <div class="pinfo">
                <label for="pinfo">Parent Information:</label>
                <input type="text"  id="pinfo" name="fname" placeholder="Father's Name" required />
                <input type="text"  id="pinfo" name="mname" placeholder="Mother's Name"  required >
                <input type="text"  id="pinfo" name="mname" placeholder="Any other's People"  required >

            </div>

            <div class="feedback_box">
                <label for="feedback">Feedback:</label><br>
                <textarea id="feedback" name="feedback" required></textarea>
            </div>
            <div class="btn_part">
                <button class="btn" type="submit">Send</button>
                <button class="btn" type="reset">Cancel</button>
            </div>
        </div>
        </form>
    </div>

<script src="script/script.js"></script>
</body>
</html>
